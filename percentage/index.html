<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080d17" />
  <title>Percentage Calculator — CalcLab</title>
  <meta name="description" content="Calculate a percentage, percentage increase, or percentage decrease." />
  <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
  <link rel="stylesheet" href="../style.css" />
  <script src="../common.js" defer></script>
  <script src="tool.js" defer></script>
</head>
<body data-root="../">
  <div id="siteHeader"></div>
  <main class="page tool-page">
    <a class="back-link" href="../#tools">← Back to All Tools</a>
    <section class="tool-intro"><p class="eyebrow">MATHEMATICS / TOOL 002</p><h1>Percentage <span>Calculator.</span></h1><p class="intro-copy">Find a percentage of a number or calculate a percentage increase or decrease.</p></section>
    <section class="utility-tool" aria-label="Percentage calculator">
      <form class="tool-form" id="percentageForm">
        <label class="tool-field">Calculation<select id="operation"><option value="of">What is X% of Y?</option><option value="change">Percentage change from X to Y</option><option value="increase">Increase X by Y%</option><option value="decrease">Decrease X by Y%</option></select></label>
        <label class="tool-field"><span id="firstLabel">Percentage (X)</span><input id="first" type="number" step="any" inputmode="decimal" required /></label>
        <label class="tool-field"><span id="secondLabel">Number (Y)</span><input id="second" type="number" step="any" inputmode="decimal" required /></label>
        <button class="tool-submit" type="submit">Calculate</button>
      </form>
      <div class="result-shell"><output class="tool-result" id="result" aria-live="polite"><span class="result-label">RESULT</span></output><button class="result-clear" type="button" aria-label="Clear result">Clear</button></div>
    </section>
    <section class="related-section"><div class="section-heading"><div><p class="eyebrow">KEEP EXPLORING</p><h2>Related tools</h2></div><a class="inline-link" href="../#tools">All tools →</a></div><div class="related-links"><a href="../calculator/">Scientific Calculator <span>Available</span></a><a href="../converter/">Unit Converter <span>Available</span></a></div></section>
  </main>
  <div id="siteFooter"></div>
</body>
</html>
