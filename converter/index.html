<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080d17" />
  <title>Unit Converter — CalcLab</title>
  <meta name="description" content="Convert length, weight, and temperature units." />
  <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
  <link rel="stylesheet" href="../style.css" />
  <script src="../common.js" defer></script>
  <script src="tool.js" defer></script>
</head>
<body data-root="../">
  <div id="siteHeader"></div>
  <main class="page tool-page">
    <a class="back-link" href="../"><span aria-hidden="true">←</span> Back to Home</a>
    <section class="tool-intro"><p class="eyebrow">CONVERTERS / TOOL 003</p><h1>Unit <span>Converter.</span></h1><p class="intro-copy">Convert common units of length, weight, and temperature.</p></section>
    <section class="utility-tool" aria-label="Unit converter">
      <form class="tool-form" id="converterForm">
        <label class="tool-field">Unit type<select id="unitType"><option value="length">Length</option><option value="weight">Weight</option><option value="temperature">Temperature</option></select></label>
        <label class="tool-field">Amount<input id="amount" type="number" step="any" inputmode="decimal" value="1" required /></label>
        <label class="tool-field">From<select id="fromUnit"></select></label>
        <label class="tool-field">To<select id="toUnit"></select></label>
        <button class="tool-submit" type="submit">Convert</button>
      </form>
      <div class="result-shell"><output class="tool-result" id="result" aria-live="polite"><span class="result-label">RESULT</span></output><button class="result-clear" type="button" aria-label="Clear result">Clear</button></div>
    </section>
    <section class="related-section"><div class="section-heading"><div><p class="eyebrow">KEEP EXPLORING</p><h2>Related tools</h2></div><a class="inline-link" href="../#tools">All tools →</a></div><div class="related-links"><a href="../percentage/">Percentage Calculator <span>Available</span></a><a href="../age/">Age Calculator <span>Available</span></a></div></section>
  </main>
  <div id="siteFooter"></div>
</body>
</html>
